services:
  postgres:
    image: postgres:15
    environment: {POSTGRES_DB: files, POSTGRES_USER: files, POSTGRES_PASSWORD: files}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U files -d files"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:5532:5432"]
  migrator:
    build: .
    env_file: [.env]
    command: ["alembic","upgrade","head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    env_file: [.env]
    depends_on:
      migrator:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8320:8320"]
    networks:
      default:
      ecosystem:
        aliases: [files]
  cleanup-worker:
    build: .
    env_file: [.env]
    depends_on:
      migrator:
        condition: service_completed_successfully
    command: ["python", "-m", "app.worker"]

networks:
  ecosystem:
    external: true
